name: rollingtab
description: Guitar passage practice with Flutter and Serverpod.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.0
  rollingtab_audio:
    path: packages/rollingtab_audio
  dart_melty_soundfont: 2.0.0
  vector_math: 2.4.0
  crypto: 3.0.7
  hooks: 2.2.0
  http: ^1.2.0
  archive: ^4.0.9
  web: ^1.1.1
  rollingtab_client:
    path: rollingtab_client
  serverpod_client: 4.0.3
  serverpod_auth_core_client: 4.0.3
  serverpod_auth_idp_client: 4.0.3
dev_dependencies:
  # Adapter regression tests exercise the plugin's feed callback contract.
  flutter_pcm_sound: 3.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/licenses/
    - assets/soundfont/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_desktop/
      platforms: [macos]
    - path: flutter_scene_generated/opengl_es/
      platforms: [web]
